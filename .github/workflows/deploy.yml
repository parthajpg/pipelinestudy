name: Build, Scan, Test and Notify

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOCKER_IMAGE: parthajpg/pipelinestudy

jobs:
  build-scan-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            -t ${{ env.DOCKER_IMAGE }}:latest \
            .

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Run application container
        run: |
          docker run -d \
            --name minishop-test \
            -p 8080:80 \
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Wait for application
        run: sleep 5

      - name: Test application
        run: |
          curl --fail --silent --show-error \
            http://localhost:8080 > /dev/null

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "SUCCESS - CI/CD Pipeline Completed"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: |
            CI/CD PIPELINE SUCCESSFUL

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
            Run Number: ${{ github.run_number }}
            Triggered By: ${{ github.actor }}

            Docker image built successfully.
            Trivy security scan completed.
            Application container test passed.
            Docker image pushed to Docker Hub.

            Image:
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

            Latest:
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "FAILED - CI/CD Pipeline Failed"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: |
            CI/CD PIPELINE FAILED

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
            Run Number: ${{ github.run_number }}
            Triggered By: ${{ github.actor }}

            Please check the GitHub Actions logs to find the failed step.

            Run URL:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Clean up test container
        if: always()
        run: |
          docker stop minishop-test || true
          docker rm minishop-test || true
