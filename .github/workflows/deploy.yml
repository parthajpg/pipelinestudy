name: Build, Scan, Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOCKER_IMAGE: parthajpg/pipelinestudy

jobs:
  build-scan-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build the Docker image with the unique Git commit SHA
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            -t ${{ env.DOCKER_IMAGE }}:latest \
            .

      # Scan Docker and repository configuration files
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

      # Scan the built Docker image for vulnerabilities
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Start the application container for testing
      - name: Run application container
        run: |
          docker run -d \
            --name minishop-test \
            -p 8080:80 \
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      # Give the web server time to start
      - name: Wait for application
        run: sleep 5

      # Verify that the application is responding
      - name: Test application
        run: |
          curl --fail --silent --show-error \
            http://localhost:8080 > /dev/null

      # Docker Hub login only for pushes to main
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push image only after all tests pass
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

      # Notification in GitHub Actions logs
      - name: Pipeline completed successfully
        if: success()
        run: |
          echo "=========================================="
          echo "PIPELINE SUCCESSFUL"
          echo "=========================================="
          echo "Docker image built successfully"
          echo "Trivy security scans completed"
          echo "Application container started successfully"
          echo "Application test passed"
          echo "Docker image pushed successfully"
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          echo "Latest: ${{ env.DOCKER_IMAGE }}:latest"
          echo "Application is ready for EC2 deployment"
          echo "=========================================="

      # Always clean up the test container
      - name: Clean up test container
        if: always()
        run: |
          docker stop minishop-test || true
          docker rm minishop-test || true
